openapi: 3.0.3
info: {title: MindGarden API, version: 1.0.0}
paths:
  /v1/auth/register: {post: {summary: Register}}
  /v1/auth/login: {post: {summary: Login}}
  /v1/moods: {get: {summary: List moods}, post: {summary: Create mood}}
  /v1/mood-tags:
    get: {summary: List active custom mood tags of current user}
    post: {summary: Create or reactivate a custom mood tag (nonblank, max 8 chars, max 12, unique per account)}
  /v1/mood-tags/{id}:
    delete: {summary: Deactivate a custom mood tag; history text and stats are preserved}
  /v1/assessments: {get: {summary: List assessments}}
  /v1/journals: {get: {summary: List journals}, post: {summary: Create journal}}
